name: R-CMD-check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Build and check
        shell: bash
        run: |
          R CMD build --no-build-vignettes .
          R CMD check --no-manual --no-build-vignettes anxlex_*.tar.gz
          grep -q 'Status: OK' anxlex.Rcheck/00check.log
      - name: Verify citation without warnings
        shell: Rscript {0}
        run: |
          .libPaths(c(normalizePath("anxlex.Rcheck"), .libPaths()))
          options(warn = 2)
          x <- citation("anxlex")
          stopifnot(length(x) == 1L, length(x[[1]]$author) == 3L)
          print(x)
